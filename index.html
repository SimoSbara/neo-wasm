<!doctype html>
<html lang="en-us">
  <head>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="win31/combined.min.css">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Near Earth Objects</title>

    <style>
        body, button, input, textarea {
            font-family: 'Microsoft Sans Serif' !important;
        }
    </style>
    <script>

        var wasm = null;
        var cur_planet = -1;
        var cur_asteroid = -1;

        function decode_c_str(pointer) 
        {
            const memoryView = new Uint8Array(wasm.memory.buffer);

            let length = 0;
            while (memoryView[pointer + length] !== 0) {
                length++;
            }

            const stringBytes = new Uint8Array(wasm.memory.buffer, pointer, length);

            const decoder = new TextDecoder('utf-8');
            return decoder.decode(stringBytes);
        }

        function date_to_iso(date)
        {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');

            return `${yyyy}-${mm}-${dd}`
        } 

        function timestamp_to_iso(t)
        {
            let seconds = parseInt(t);
            let date = new Date(seconds)

            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');

            return `${yyyy}-${mm}-${dd}`
        } 


        function days_date_diff(first, second) 
        {        
            return Math.round((second - first) / (1000 * 60 * 60 * 24));
        }

        function msec_date_diff(first, second) 
        {        
            return BigInt(second - first);
        }

        async function init_events()
        {
            const canvas = document.getElementById("buffer")
            canvas.addEventListener('mousedown', function(e) {
                on_planet_click(canvas, e)
            })

            const btn1 = document.getElementById("btn1")
            btn1.addEventListener('click', function(e) {

                let dlginfo = document.getElementById("dlg-info")
                dlginfo.hidden = true

                load_asteroids_table(cur_planet)

                let dlg_asteroids = document.getElementById("dlg-asteroids")
                dlg_asteroids.hidden = false
            })

            const btn2 = document.getElementById("btn2")
            btn2.addEventListener('click', function(e) {
                let dlg = document.getElementById("dlg-info")
                dlg.hidden = true
            })

            const btn1_list = document.getElementById("dlg-asteroids-btn1")
            btn1_list.addEventListener('click', function(e) {

                if(cur_asteroid == -1)
                    return

                select_asteroid(cur_asteroid)

                let dlg = document.getElementById("dlg-asteroid-info")
                dlg.hidden = false
            })

            const btn2_list = document.getElementById("dlg-asteroids-btn2")
            btn2_list.addEventListener('click', function(e) {
                let dlg = document.getElementById("dlg-asteroids")
                dlg.hidden = true

                cur_planet = -1
                cur_asteroid = -1
            })

            const btn_ok = document.getElementById("dlg-asteroid-info-ok")
            btn_ok.addEventListener('click', function(e) {
                let dlg = document.getElementById("dlg-asteroid-info")
                dlg.hidden = true
            })
        }

        async function init()
        {
            init_events()

            const app = await fetch('app.wasm');
            const stream = await WebAssembly.instantiateStreaming(app);
            wasm = stream.instance.exports;
            
            var j2000 = msec_date_diff(new Date(2000, 1, 1), new Date())
            var epoch = msec_date_diff(new Date(1970, 1, 1), new Date())

            console.log("j2000 " + j2000)
            wasm.set_timestamp_since_j2000(j2000)
            wasm.set_timestamp_since_epoch(epoch)

            if(load_asteroids())
                draw_asteroids()
        }

        function load_asteroids_table(planet)
        {
            let n = wasm.get_num_asteroids(planet)
            const tbody = document.getElementById('asteroids-list')

            //svuoto
            tbody.innerHTML = "";
            cur_asteroid = -1

            for(let i = 0; i < n; i++)
            {
                const tr = document.createElement('tr')

                let namec = wasm.get_asteroid_name(planet, i)
                let timestamp = wasm.get_asteroid_timestamp(planet, i)

                let name = decode_c_str(namec)
                let t = timestamp_to_iso(timestamp)

                tr.setAttribute('role', 'option')
                tr.innerHTML = 
                `
                    <td>
                        <div class="icon">
                        <div class="icon-label">${name}</div>
                        </div>
                    </td>
                    <td>${t}</td>
                `

                tbody.appendChild(tr)
            }

            tbody.addEventListener('click', function(event) {
                on_asteroid_click(event)
            })
        }

        function handle_planet_click(planet)
        {
            let n = wasm.get_num_asteroids(planet)
            console.log("n " + n)

            let dlg = document.getElementById("dlg-info")
            let dlgInfo = document.getElementById("dlg-info-body")
            let btn1 = document.getElementById("btn1")

            if(n == 0)
            {   
                btn1.hidden = true
                dlgInfo.textContent = "There are 0 Asteroids!"
            }  
            else
            {
                btn1.hidden = false
                dlgInfo.textContent = "There are " + n + " Asteroids!"
            }

            dlg.hidden = false
            cur_planet = planet
        }

        function select_asteroid(asteroid)
        {
            let planet = cur_planet
            let i = asteroid

            let namec = wasm.get_asteroid_name(planet, i)
            let min_d = wasm.get_asteroid_min_diameter(planet, i)
            let max_d = wasm.get_asteroid_max_diameter(planet, i)
            let distance = wasm.get_asteroid_miss_distance(planet, i)
            let velocity = wasm.get_asteroid_velocity(planet, i)
            let hazard = wasm.is_asteroid_hazardous(planet, i)

            let aname = document.getElementById("asteroid-name")
            let amin_d = document.getElementById("asteroid-min-diam")
            let amax_d = document.getElementById("asteroid-max-diam")
            let adist = document.getElementById("asteroid-miss-distance")
            let avel = document.getElementById("asteroid-velocity")
            let ahaz = document.getElementById("hazard-warning")

            aname.value = decode_c_str(namec)
            amin_d.value = min_d
            amax_d.value = max_d
            adist.value = distance
            avel.value = velocity
            ahaz.hidden = (hazard == 0)
        }

        function on_planet_click(canvas, event) 
        {
            const rect = canvas.getBoundingClientRect()

            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = (event.clientX - rect.left) * scaleX;
            const y = (event.clientY - rect.top) * scaleY;

            console.log("x: " + x + " y: " + y)

            const planet = wasm.get_planet_by_position(x, y)

            console.log("planet: " + planet)

            if(planet === -1)
                return

            handle_planet_click(planet)
        }

        function on_asteroid_click(event)
        {
            // Trova l'elemento genitore 'tr' più vicino al punto in cui hai cliccato
            const clickedRow = event.target.closest('tr');
            
            // Se non hai cliccato su una riga, interrompi
            if (!clickedRow) return;

            // 1. Deseleziona TUTTE le righe della tabella
            const tbody = clickedRow.closest('tbody');

            const allRows = tbody.querySelectorAll('tr');
            allRows.forEach(row => {
                row.setAttribute('aria-selected', 'false');
            });

            // 2. Applica la selezione direttamente sull'INTERA riga cliccata
            clickedRow.setAttribute('aria-selected', 'true');

            console.log("i " + clickedRow.sectionRowIndex)

            cur_asteroid = clickedRow.sectionRowIndex
        }

        function elab_asteroids(asteroids_json)
        {
            console.log(asteroids_json)

            const encoder = new TextEncoder();
            const bytes = encoder.encode(asteroids_json);

            var ptr = wasm.alloc_memory(bytes.length + 1)

            if (ptr === 0) 
            {
                console.error("Failed to alloc()");
                return false;
            }

            const memoriaWasm = new Int8Array(wasm.memory.buffer, ptr, bytes.length + 1);
            memoriaWasm.set(bytes);
            memoriaWasm[bytes.length] = 0;

            var status = wasm.load_asteroids(ptr, bytes.length)
            wasm.free_memory(ptr)

            console.log("status load " + status)

            if(!status)
            {
                console.log("Failed to parse JSON: " + asteroids_json);
                return false;
            }
            
            return true
        }

        async function load_asteroids() 
        {
            var today = new Date()
            var past_7days = new Date()
            past_7days.setDate(today.getDate() - 7)

            var date = new Date()
            var today = date_to_iso(date)

            date.setDate(date.getDate() - 7)
            var past_7days = date_to_iso(date)
        
            console.log(today)
            console.log(past_7days)

            var cache_name = 'cache_asteroids_' + today + "_" + past_7days
            var json = localStorage.getItem(cache_name);

            if (json === null)
            {
                var response = await fetch(`https://api.nasa.gov/neo/rest/v1/feed?start_date=${past_7days}&end_date=${today}&api_key=DEMO_KEY`);

                if (!response.ok)
                    throw new Error("GET failed! ${response.status}");
                
                json = await response.json();
                json = JSON.stringify(json)
                localStorage.setItem(cache_name, json);
                console.log("JSON saved in cache!");
            }
            else
                console.log("JSON found in cache!");

            var status = elab_asteroids(json)
            
            if(status)
                console.log("num " + wasm.get_num_asteroids(2))

            console.log("status " + status)

            return status
        }

        async function draw_asteroids() 
        {
            var canvas = document.getElementById("buffer");
            var cxt = canvas.getContext("2d");
            var s = Math.min(document.body.clientWidth, document.body.clientHeight)

            canvas.width = s;
            canvas.height = s;

            var width = canvas.width;
            var height = canvas.height;
            var ptr = wasm.draw_asteroids(width, height);

            if (ptr === 0) 
            {
                console.error("Cannot allocate memory!");
                return;
            }

            console.log(width + " " + height)

            var wasmArray = new Uint8ClampedArray(wasm.memory.buffer, ptr, width * height * 4);
            var imageData = new ImageData(wasmArray, width, height);

            cxt.putImageData(imageData, 0, 0);
        }
    </script>
  </head>
